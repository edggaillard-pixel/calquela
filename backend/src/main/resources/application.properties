spring.application.name=calquela
server.port=8080

# Envois de fichiers (images de tatouage)
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Taille maximale d'un corps de requête JSON (projets partagés, images incluses)
server.tomcat.max-http-form-post-size=16MB
server.tomcat.max-swallow-size=16MB

# Compression : l'avatar 3D (avatar.bin) passe de 4,6 Mo à environ 3,8 Mo
server.compression.enabled=true
server.compression.mime-types=application/json,application/octet-stream,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2048

# Cache des fichiers statiques (les fichiers JS/CSS de Vite ont un nom unique)
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true

# CalqueLa
calquela.storage-dir=./data/projects
calquela.retention-days=30
calquela.max-project-bytes=15728640
calquela.requests-per-minute=30

# GROGNON
