# Publie la démo en ligne sur GitHub Pages à chaque envoi sur la branche main.
# Sans serveur Java, le détourage se fait dans le navigateur ; seul le partage
# par lien est indisponible sur la démo.
name: Démo GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/src/main/resources/static
      - id: deployment
        uses: actions/deploy-pages@v4

